name: Deploy to Fly.io

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@main

      - name: Set fly secrets
        run: |
          flyctl secrets set FB999_PHONE="${{ secrets.FB999_PHONE }}" \
            FB999_PASSWORD="${{ secrets.FB999_PASSWORD }}" \
            DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/deploy@main
        with:
          args: "--image-label ${{ github.SHA }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Show app status
        run: flyctl status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
