app = "wingo-racer"

kill_signal = "SIGINT"
kill_timeout = 5

[env]
  NODE_ENV = "production"
  PORT = "3000"

[experimental]
  allowed_public_ports = [3000]
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 3000
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    type = "connection"
    hard_limit = 100
    soft_limit = 75

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1m"
    interval = "15s"
    restart_limit = 0
    timeout = "10s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "1m"
    method = "get"
    path = "/health"
    protocol = "http"
    restart_limit = 0
